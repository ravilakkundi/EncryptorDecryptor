<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Password Vault</title>
<style>
:root { color-scheme: light dark; font: 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { max-width: 720px; margin: 24px auto; padding: 0 16px; line-height: 1.5; }
h1 { font-size: 1.6rem; margin-bottom: 6px; }
h2 { font-size: 1.25rem; margin-top: 0; }
p.note { font-size: 0.9rem; opacity: 0.85; margin-bottom: 20px; }
section { border: 1px solid #8884; border-radius: 12px; padding: 20px; margin-bottom: 24px; background-color: rgba(127,127,127,0.03); }
label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: 0.95rem; }
input, textarea, button { box-sizing: border-box; width: 100%; font: inherit; padding: 12px; border-radius: 8px; border: 1px solid #8888; background: transparent; color: inherit; }
textarea { min-height: 80px; resize: vertical; }
button { margin-top: 16px; cursor: pointer; font-weight: 600; background-color: #0066cc; color: #fff; border: none; transition: opacity 0.2s; }
button:hover { opacity: 0.9; }
button.secondary { background-color: transparent; color: inherit; border: 1px solid #8888; margin-top: 8px; font-weight: normal; font-size: 0.88rem; padding: 6px 12px; width: auto; display: inline-block; }
.status { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 14px; font-weight: 500; font-size: 0.92rem; }
.status.error { color: #e53935; }
.status.success { color: #43a047; }
details summary { cursor: pointer; font-weight: 600; color: #0066cc; }
</style>
</head>
<body>

<h1>Family Password Vault</h1>
<p class="note">Client-side zero-knowledge vault. Runs entirely inside your browser memory with zero server history.</p>

<!-- SECTION 1: DECRYPTOR (PRIMARY FOR FAMILY USERS) -->
<section>
  <h2>1. Decrypt a Record</h2>
  <label for="key2">Shared Family Passphrase</label>
  <input id="key2" type="password" placeholder="Enter shared passphrase" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

  <label for="ciphertext">Compact Encrypted Token</label>
  <textarea id="ciphertext" placeholder="Paste token string here (e.g. v1$...)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

  <button id="decrypt">Decrypt Token</button>
  <div id="decStatus" class="status" role="status"></div>

  <hr style="margin: 20px 0; border: 0; border-top: 1px dashed #8886;">

  <label for="outService">Service Name</label>
  <input id="outService" readonly autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="—">

  <label for="outUsername">Username / Account ID</label>
  <input id="outUsername" readonly autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="—">

  <label for="outPassword">Password</label>
  <input id="outPassword" type="password" readonly autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="—">
  <button id="showPassword" type="button" class="secondary">Show / Hide Password</button>

  <label for="outNotes">Notes</label>
  <textarea id="outNotes" readonly autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="—"></textarea>
</section>

<!-- SECTION 2: ENCRYPTOR (SECONDARY / ADVANCED) -->
<details>
  <summary>Need to Encrypt a New Password? Click here to open Encryptor</summary>
  <section style="margin-top: 14px;">
    <h2>2. Encrypt a Record</h2>
    <label for="key1">Shared Family Passphrase</label>
    <input id="key1" type="password" placeholder="Enter shared passphrase" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

    <label for="service1">Service Name (e.g. Netflix)</label>
    <input id="service1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Service name">

    <label for="username1">Username / Account Identifier (optional)</label>
    <input id="username1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Username or email">

    <label for="password1">Password</label>
    <input id="password1" type="password" autocomplete="new-password" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Password">

    <label for="notes1">Notes (optional)</label>
    <textarea id="notes1" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Additional notes"></textarea>

    <button id="encrypt">Encrypt to Token</button>

    <label for="encrypted">Generated Encrypted Token String</label>
    <textarea id="encrypted" readonly autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Generated token will appear here..."></textarea>
    <div id="encStatus" class="status" role="status"></div>
  </section>
</details>

<script>
'use strict';
const ITERATIONS = 600000;
const enc = new TextEncoder();
const dec = new TextDecoder();

// Helper: Uint8Array <-> Base64URL string (URL-safe format)
function bytesToB64Url(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function b64UrlToBytes(str) {
  let base64 = str.replace(/-/g, '+').replace(/_/g, '/');
  while (base64.length % 4 !== 0) base64 += '=';
  const raw = atob(base64);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

function randomBytes(n) {
  const b = new Uint8Array(n);
  crypto.getRandomValues(b);
  return b;
}

async function deriveKey(passphrase, salt, usage) {
  const material = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: ITERATIONS, hash: 'SHA-256' },
    material,
    { name: 'AES-GCM', length: 256 },
    false,
    [usage]
  );
}

function clearOutputs() {
  for (const id of ['outService', 'outUsername', 'outPassword', 'outNotes']) {
    const el = document.getElementById(id);
    if (el) el.value = '';
  }
}

// Decrypt Handler
document.getElementById('decrypt').addEventListener('click', async () => {
  const status = document.getElementById('decStatus');
  status.textContent = '';
  status.className = 'status';
  clearOutputs();

  try {
    if (!crypto?.subtle) {
      throw new Error('Web Crypto API is unavailable. Ensure you are accessing via HTTPS or a secure context.');
    }
    const key = document.getElementById('key2').value;
    const token = document.getElementById('ciphertext').value.trim();

    if (!key) throw new Error('Please enter the shared passphrase.');
    if (!token) throw new Error('Please paste the encrypted token string.');

    const parts = token.split('$');
    if (parts.length !== 4 || parts[0] !== 'v1') {
      throw new Error('Invalid or unsupported token format. Expected format: v1$salt$iv$ciphertext');
    }

    let salt, iv, ciphertext;
    try {
      salt = b64UrlToBytes(parts[1]);
      iv = b64UrlToBytes(parts[2]);
      ciphertext = b64UrlToBytes(parts[3]);
    } catch (e) {
      throw new Error('Failed to decode Base64URL token string.');
    }

    const aesKey = await deriveKey(key, salt, 'decrypt');
    let plaintextBuffer;
    try {
      plaintextBuffer = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv, tagLength: 128 },
        aesKey,
        ciphertext
      );
    } catch (e) {
      throw new Error('Decryption failed. Incorrect passphrase or corrupted token.');
    }

    const p = JSON.parse(dec.decode(plaintextBuffer));
    if (p.v !== 1 || typeof p.password !== 'string') {
      throw new Error('Decrypted contents do not match expected record format.');
    }

    document.getElementById('outService').value = p.service || '';
    document.getElementById('outUsername').value = p.username || '';
    document.getElementById('outPassword').value = p.password || '';
    document.getElementById('outNotes').value = p.notes || '';

    status.textContent = 'Decryption successful. Password loaded.';
    status.className = 'status success';
  } catch (e) {
    status.textContent = 'Error: ' + (e.message || 'Decryption failed.');
    status.className = 'status error';
  }
});

// Encrypt Handler
document.getElementById('encrypt').addEventListener('click', async () => {
  const status = document.getElementById('encStatus');
  status.textContent = '';
  status.className = 'status';
  document.getElementById('encrypted').value = '';

  try {
    if (!crypto?.subtle) {
      throw new Error('Web Crypto API is unavailable. Ensure you are accessing via HTTPS or a secure context.');
    }
    const key = document.getElementById('key1').value;
    const service = document.getElementById('service1').value.trim();
    const username = document.getElementById('username1').value.trim();
    const password = document.getElementById('password1').value;
    const notes = document.getElementById('notes1').value;

    if (!key || key.length < 12) throw new Error('Shared passphrase must be at least 12 characters long.');
    if (!service) throw new Error('Service name is required.');
    if (!password) throw new Error('Password is required.');

    const payload = { v: 1, service, username, password, notes };
    const salt = randomBytes(16);
    const iv = randomBytes(12);
    const aesKey = await deriveKey(key, salt, 'encrypt');
    const ciphertext = await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv, tagLength: 128 },
      aesKey,
      enc.encode(JSON.stringify(payload))
    );

    const token = `v1$${bytesToB64Url(salt)}$${bytesToB64Url(iv)}$${bytesToB64Url(new Uint8Array(ciphertext))}`;
    document.getElementById('encrypted').value = token;

    status.textContent = 'Encryption complete! Copy the token above.';
    status.className = 'status success';

    // Clear password input field after encryption
    document.getElementById('password1').value = '';
  } catch (e) {
    status.textContent = 'Error: ' + (e.message || 'Encryption failed.');
    status.className = 'status error';
  }
});

// Show / Hide password toggle
document.getElementById('showPassword').addEventListener('click', () => {
  const p = document.getElementById('outPassword');
  p.type = p.type === 'password' ? 'text' : 'password';
});

// Clear all inputs on page unload / refresh
window.addEventListener('beforeunload', () => {
  const ids = ['key1', 'key2', 'service1', 'username1', 'password1', 'notes1', 'encrypted', 'ciphertext', 'outService', 'outUsername', 'outPassword', 'outNotes'];
  for (const id of ids) {
    const el = document.getElementById(id);
    if (el) el.value = '';
  }
});

// Environment check on load
if (!crypto?.subtle) {
  const status = document.getElementById('decStatus');
  status.textContent = 'Warning: Web Crypto API is unavailable in this environment.';
  status.className = 'status error';
}
</script>
</body>
</html>
